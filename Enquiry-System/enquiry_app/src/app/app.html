<nav class="app-navbar" aria-label="Main navigation">
  <div class="navbar-inner mx-auto flex w-full items-center justify-between">
    <a class="brand-link" [routerLink]="isLoggedIn() ? null : '/enquiry'" (click)="closeMobileNavigation()">
      <span class="brand-symbol" aria-hidden="true">
        <span class="brand-symbol-dot"></span>
        <span class="brand-symbol-line"></span>
      </span>
      <span>
        <strong>Enquiry <small>DESK</small></strong>
      </span>
    </a>

    <button class="nav-toggle" type="button" aria-label="Toggle navigation" [attr.aria-expanded]="mobileMenuOpen()" aria-controls="mainNavigation" (click)="toggleMobileNavigation()">
      <span class="nav-toggle-icon" [class.is-open]="mobileMenuOpen()" aria-hidden="true">
        <span></span><span></span><span></span>
      </span>
    </button>

    <div class="nav-content flex flex-1 items-center justify-between" id="mainNavigation" [class.logged-out]="!isLoggedIn()" [class.mobile-open]="mobileMenuOpen()">
      <ul class="nav-list main-nav mb-0 flex">
        @if (isLoggedIn()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/enquiries" routerLinkActive="active" (click)="closeMobileNavigation()">
              <span class="nav-icon nav-icon-list" aria-hidden="true"></span> Enquiry list
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/categories" routerLinkActive="active" (click)="closeMobileNavigation()">
              <span class="nav-icon nav-icon-grid" aria-hidden="true"></span> Category master
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/statuses" routerLinkActive="active" (click)="closeMobileNavigation()">
              <span class="nav-icon nav-icon-status" aria-hidden="true"></span> Status master
            </a>
          </li>
        }
      </ul>

      <div class="navbar-actions">
        @if (isLoggedIn()) {
          <a class="admin-profile" routerLink="/admin/login" aria-label="Open admin workspace options" (click)="closeMobileNavigation()">
            <span class="profile-avatar" aria-hidden="true">A</span>
            <span class="profile-copy"><strong>Admin</strong><small>Workspace</small></span>
          </a>
        } @else {
          <a class="admin-access-link" routerLink="/admin/login" (click)="closeMobileNavigation()">
            <svg class="admin-access-mark" viewBox="0 0 20 20" aria-hidden="true">
              <path d="M6.5 9V6.5a3.5 3.5 0 0 1 7 0V9M5 9h10v8H5zM10 12v2" />
            </svg>
            <span>Admin portal</span>
            <svg class="admin-access-arrow" viewBox="0 0 18 18" aria-hidden="true">
              <path d="M6 12 12 6M6.5 6H12v5.5" />
            </svg>
          </a>
        }
      </div>
    </div>
  </div>
</nav>

<main class="app-content">
  <router-outlet></router-outlet>
</main>

<app-confirmation-dialog></app-confirmation-dialog>
